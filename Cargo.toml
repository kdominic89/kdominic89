[workspace]
members = [
  "crates/sourcefield-core",
  "crates/sourcefield-collector",
  "crates/sourcefield-render",
  "crates/sourcefield-cli",
  "crates/sourcefield-wasm",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
authors = ["Dominic <kdominic89@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/kdominic89/kdominic89"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1"
wasm-bindgen = "0.2"

sourcefield-core = { path = "crates/sourcefield-core" }
sourcefield-collector = { path = "crates/sourcefield-collector" }
sourcefield-render = { path = "crates/sourcefield-render" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
