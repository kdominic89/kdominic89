name: Update SOURCEFIELD

on:
  workflow_dispatch:
    inputs:
      include_private_count:
        description: "Include only the aggregate number of private repositories (requires PROFILE_TOKEN)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: sourcefield-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      REQUEST_PRIVATE_COUNTS: ${{ (github.event_name == 'workflow_dispatch' && inputs.include_private_count) || vars.SOURCEFIELD_PRIVATE_COUNTS == 'true' }}
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain

      - name: Check and test native workspace
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo check -p sourcefield-wasm --target wasm32-unknown-unknown --locked
          cargo test --workspace --all-targets --locked
          cargo test --workspace --doc --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --document-private-items --locked
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/browser*.mjs

      - name: Collect, analyze and render live field
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          arguments=(
            --config config/profile.toml
            --fallback-snapshot config/offline-snapshot.json
            --assets assets
            --docs docs
            --strict-live
          )
          if [[ "$REQUEST_PRIVATE_COUNTS" == "true" ]]; then
            if [[ -n "$PROFILE_TOKEN" ]]; then
              arguments+=(--private-counts)
            else
              echo "::warning::Private aggregate requested, but PROFILE_TOKEN is not configured. Continuing without it."
            fi
          fi
          cargo run --locked --release -p sourcefield-cli -- generate "${arguments[@]}"

      - name: Build Rust simulation for the browser
        run: |
          cargo install wasm-pack --version 0.15.0 --locked
          ./scripts/build-wasm.sh

      - name: Validate generated artifact
        run: |
          cargo run --locked -p sourcefield-cli -- validate
          python3 scripts/validate_artifact.py --require-wasm
          python3 -m unittest discover -s tests -p 'test_presentation.py'
          node --check docs/app.js
          node --check docs/simulation-fallback.js

      - name: Commit changed state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Compiled WASM is deployed as an artifact, never committed.
          git add assets docs/profile-state.json docs/build-meta.json docs/history docs/sourcefield.*.svg
          if git diff --cached --quiet; then
            echo "SOURCEFIELD already reflects the current semantic state."
          else
            git commit -m "chore(profile): update sourcefield state [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy interactive field
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
